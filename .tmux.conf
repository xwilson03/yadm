### Options

set -g set-clipboard on     # Sync clipboard
set -g focus-events on      # Focus events for Nvim
set -sg escape-time 10      # Reduce Esc delay
set -g allow-rename off     # Disable window auto rename
set -g renumber-windows on  # Enable window auto renumbering
# Split panes using \ and -
unbind '"'
unbind %
bind -n M-\\ split-window -h
bind -n M-- split-window -v

# Ensure key chords are supported
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Enable full color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"



# Detect if window is Vim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

# Navigation
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }
bind-key -n 'M-n' if-shell "$is_vim" 'send-keys M-n' { if -F '#{window_end_flag}' '' 'select-window -n' }
bind-key -n 'M-p' if-shell "$is_vim" 'send-keys M-p' { if 'test #{window_index} -gt #{base-index}' 'select-window -p' }

bind-key -T copy-mode-vi 'M-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'M-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'M-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'M-l' if -F '#{pane_at_right}' '' 'select-pane -R'
bind-key -T copy-mode-vi 'M-n' if -F '#{window_end_flag}' '' 'select-window -n'
bind-key -T copy-mode-vi 'M-p' if 'test #{window_index} -gt #{base-index}' 'select-window -p'

# Resize
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'resize-pane -L 1'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'resize-pane -D 1'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'resize-pane -U 1'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'resize-pane -R 1'

bind-key -T copy-mode-vi C-h resize-pane -L 1
bind-key -T copy-mode-vi C-j resize-pane -D 1
bind-key -T copy-mode-vi C-k resize-pane -U 1
bind-key -T copy-mode-vi C-l resize-pane -R 1

# Swap Panes
bind -n 'C-M-h' if-shell "$is_vim" 'send-keys C-M-h' 'swap-pane -s "{left-of}"'
bind -n 'C-M-j' if-shell "$is_vim" 'send-keys C-M-j' 'swap-pane -s "{down-of}"'
bind -n 'C-M-k' if-shell "$is_vim" 'send-keys C-M-k' 'swap-pane -s "{up-of}"'
bind -n 'C-M-l' if-shell "$is_vim" 'send-keys C-M-l' 'swap-pane -s "{right-of}"'

bind-key -T copy-mode-vi C-M-h swap-pane -s "{left-of}"
bind-key -T copy-mode-vi C-M-j swap-pane -s "{down-of}"
bind-key -T copy-mode-vi C-M-k swap-pane -s "{up-of}"
bind-key -T copy-mode-vi C-M-l swap-pane -s "{right-of}"
